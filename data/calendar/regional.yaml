  quote:
    id: rg-ad-2025-117
    page: 1
    text: |-
      1. Установить в 2026 году даты проведения религиозных праздничных дней:
      1) Ураза-Байрам – 20 марта;
      2) День поминовения усопших (Радоница) – 21 апреля;
      3) Курбан-Байрам – 27 мая.
