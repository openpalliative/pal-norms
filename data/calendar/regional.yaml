    text: |-
      Статья 1
      1. В Республике Саха (Якутия) устанавливаются следующие нерабочие праздничные дни:
      27 апреля – День Республики Саха (Якутия);
      21 июня – День национального праздника «Ысыах».
      2. При совпадении выходного и нерабочего праздничного дней выходной день переносится на следующий после праздничного рабочий день.
