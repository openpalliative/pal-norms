rules:
- id: 692n-mse
  what: Срок не более 3 рабочих дней для медико-социальной экспертизы без доступа к персональным данным гражданина, нуждающегося в паллиативной помощи
  where: приказ 692н, прил. 2, п. 4 (стр. 8 PDF 0001202604140027)
  why_not_published: 'Решение 12.10.2026 (FINAL_v2 №5): правилом не публикуем. Срок не более 3 рабочих дней относится к особому порядку экспертизы без личного присутствия и без доступа к персональным данным (прил. 2, п. 4, стр. 8 PDF 0001202604140027). Для паллиативных пациентов срок 3 рабочих дня по общему порядку уже есть в правиле pp588-mse. Кому применяется особый порядок, должен решить юрист'
- id: pp-240-tsr
  what: Сроки обеспечения техническими средствами реабилитации
  where: постановление Правительства № 240 от 07.04.2008
  why_not_published: Текста нет на портале официальной публикации, а ИПС из Австрии открывается только через снимки web.archive.org
- id: 180n-protocol
  what: Протокол врачебной комиссии оформляется в срок не более трёх рабочих дней со дня заседания
  where: приказ 180н, п. 15 (стр. 4 PDF 0001202505160009)
  why_not_published: 'Решение 12.10.2026 (FINAL_v2 №5): правилом не публикуем. Протокол оформляется для медицинской организации, семья видит решение через выписку из протокола, срок выписки (3 рабочих дня со дня запроса, п. 16) есть в правиле 180n-protocol-extract'
- id: esc-rzn-central
  what: 'Ступень эскалации: жалоба на бездействие территориального органа Росздравнадзора в центральный аппарат'
  where: положение о Росздравнадзоре, административный регламент по обращениям
  why_not_published: Официальной цитаты, которая называет такой порядок, на портале публикации не нашли. Без цитаты ступень не добавляем
- id: 208n-a38-social-referral
  what: Медицинская организация направляет в соцзащиту обращение о социальном обслуживании человека, который не может себя обслуживать, в течение 1 рабочего дня с даты выявления такого пациента
  where: приказ 208н/243н, прил. 38, п. 4 (стр. 192 PDF 0001202505290031)
  why_not_published: 'Отсчёт идёт от даты выявления, которую семья не знает и проверить не может. Следующие шаги с понятным началом есть в калькуляторе: 208n-a38-social-visit и 208n-a38-social-decision'
- id: 208n-a38-social-referral-incapable
  what: 'То же обращение для недееспособного человека: в течение 1 рабочего дня с даты получения согласия законного представителя'
  where: приказ 208н/243н, прил. 38, п. 5 (стр. 192 PDF 0001202505290031)
  why_not_published: Пункт касается недееспособных граждан, как подтверждается дата согласия, должен сказать юрист. До этого правило не публикуем
- id: 208n-a38-before-discharge-10
  what: Обращение о социальном обслуживании при выписке из стационара направляется не позднее чем за 10 дней до планируемой выписки
  where: приказ 208н/243н, прил. 38, п. 6 (стр. 192 PDF 0001202505290031)
  why_not_published: В пункте не сказано, календарные это дни или рабочие, а дату планируемой выписки семья заранее обычно не знает
- id: 208n-a38-urgent-same-day
  what: Срочные социальные услуги предоставляются в день поступления обращения медицинской организации, если в нём указана такая необходимость
  where: приказ 208н/243н, прил. 38, п. 8 (стр. 192 PDF 0001202505290031)
  why_not_published: Срок «в день поступления», считать калькулятором нечего. Пункт можно показать текстом на странице о социальном обслуживании
- id: 208n-a38-alone-before-discharge-2
  what: Социальное обслуживание одиноко проживающего человека на дому организуется не позднее чем за 2 дня до выписки из стационара
  where: приказ 208н/243н, прил. 38, п. 11 (стр. 193 PDF 0001202505290031)
  why_not_published: В пункте не сказано, какие это дни, дату выписки заранее семья обычно не знает
- id: 208n-a38-inpatient-social-month
  what: Стационарное социальное обслуживание организуется в срок не более 1 месяца с даты признания нуждающимся в нём
  where: приказ 208н/243н, прил. 38, п. 12 (стр. 193 PDF 0001202505290031)
  why_not_published: Калькулятор пока не считает сроки в месяцах (в lib/deadlines.js нет такой единицы). Добавим вместе с поддержкой месяцев
- id: 208n-a38-resident-exam
  what: В доме-интернате (стационарной организации социального обслуживания) при выявлении показаний к паллиативной помощи осмотр с участием врача по паллиативной помощи организуют в течение 2 рабочих дней
  where: приказ 208н/243н, прил. 38, п. 23 (стр. 195 PDF 0001202505290031)
  why_not_published: Отсчёт от выявления показаний, дату семья не знает. Срок для организаций, кандидат в правило для аудитории org
- id: 208n-a38-mse-referral
  what: Медицинская организация оформляет направление на медико-социальную экспертизу в срок не более 1 рабочего дня со дня получения результатов обследований
  where: приказ 208н/243н, прил. 38, п. 29 (стр. 196 PDF 0001202505290031)
  why_not_published: Тот же срок уже есть в правиле pp588-referral по п. 17 Правил ПП 588
- id: 208n-a38-mse-transfer
  what: Медицинская организация в течение 1 рабочего дня с даты оформления направления передаёт его и результаты обследований в бюро медико-социальной экспертизы
  where: приказ 208н/243н, прил. 38, п. 30 (стр. 196 PDF 0001202505290031)
  why_not_published: Дату оформления направления семья обычно не знает. Следующий срок, который семья может проверить, есть в правиле pp588-mse
- id: 208n-resp-after-discharge
  what: После выписки из респираторного центра первичный осмотр организуют в течение 2 рабочих дней
  where: приказ 208н/243н, прил. 23, п. 10 (стр. 111 PDF 0001202505290031)
  why_not_published: Тот же срок и то же начало, что в правиле 208n-p20-after-discharge, только для выписки из респираторного центра. Отдельное правило решим после проверки юристом
- id: 208n-resp-device-hours
  what: Если аппарат ИВЛ неисправен и его нельзя починить или заменить в течение 2 часов, человека госпитализируют; при вентиляции до 16 часов в сутки неисправность устраняют или аппарат меняют в течение 24 часов
  where: приказ 208н/243н, прил. 23, п. 12 (стр. 111 PDF 0001202505290031)
  why_not_published: Сроки в часах, калькулятор считает дни. Что делать при поломке аппарата, нужно показывать текстом после проверки медиком
- id: 208n-day-hospital-6h
  what: Инфузионная терапия в дневном стационаре продолжительностью не более 6 часов
  where: приказ 208н/243н, прил. 32 (стр. 157 PDF 0001202505290031)
  why_not_published: Не срок, а продолжительность процедуры
- id: 505n-ivl-hours
  what: Поддерживать спонтанное дыхание в течение 2-4 часов как условие передачи аппарата ИВЛ на дом
  where: приказ 505н (стр. 3 PDF 0001201909250013)
  why_not_published: Не срок, а медицинское условие. Медицинские пороги проект не публикует
- id: 180n-protocol-storage
  what: Протоколы врачебной комиссии хранятся в течение десяти лет
  where: приказ 180н, п. 17 (стр. 5 PDF 0001202505160009)
  why_not_published: Срок хранения документов в медицинской организации, не срок ответа или действия
- id: 180n-fund-age
  what: Поддержка фондом «Круг добра» в течение одного года после достижения 18 лет
  where: приказ 180н (стр. 6 PDF 0001202505160009)
  why_not_published: Условие о составе врачебной комиссии, не срок для семьи
- id: 100n-arrival-notice
  what: Аптека в течение одного рабочего дня со дня поступления лекарственного препарата по рецепту на отсроченном обслуживании сообщает об этом по телефону или СМС
  where: приказ 100н, прил. 1, п. 16 (стр. 7 и 11 PDF 0001202504100006)
  why_not_published: Отсчёт от поступления препарата в аптеку, дату семья не знает. Главные сроки отложенного рецепта есть в правилах 100n-deferred, 100n-deferred-cito и 100n-deferred-purchase
- id: 100n-storage
  what: 'Сроки хранения рецептов в аптеке: три месяца, три года, пять лет в зависимости от препарата'
  where: приказ 100н, прил. 1 и 2 (стр. 8 и 13 PDF 0001202504100006)
  why_not_published: Сроки хранения документов в аптеке, не срок для семьи
- id: 1094n-cito-definition
  what: 'Пометка о срочном отпуске: «в течение двух рабочих дней»'
  where: приказ 1094н, п. 18 Порядка (стр. 12 PDF 0001202111300115)
  why_not_published: Это описание пометки в рецепте. Срок отпуска по такому рецепту в аптеке задаёт приказ 100н (правило 100n-deferred-cito, три рабочих дня). Как сочетаются два срока, должен сказать юрист
- id: 1094n-validity
  what: 'Срок действия рецепта: 15, 30, 60 или 90 дней, до одного года'
  where: приказ 1094н, Порядок назначения (стр. 12-13 PDF 0001202111300115)
  why_not_published: Срок действия зависит от формы бланка и препарата. Без медика и юриста не публикуем, названия препаратов проект не приводит
- id: 1094n-vk-criteria
  what: Пять и более препаратов в течение суток или свыше десяти наименований в течение тридцати дней
  where: приказ 1094н (стр. 15 PDF 0001202111300115)
  why_not_published: Не срок, а условие для решения врачебной комиссии
- id: 1094n-blanks
  what: Сроки заявок на специальные рецептурные бланки (до 1 октября, до 1 декабря, до 15 января, отчёт до 20 числа)
  where: приказ 1094н, приложения о бланках (стр. 36-40 PDF 0001202111300115)
  why_not_published: Сроки для медицинских организаций и органов власти, семьи их не касаются
- id: pp588-reexam
  what: 'Сроки переосвидетельствования инвалидности: не позднее 2 и 4 лет после первичного признания, заблаговременно не более чем за 2 месяца'
  where: Правила ПП 588 (стр. 5, 32, 35 PDF 0001202204080035)
  why_not_published: Не срок ответа, а условия установления инвалидности без срока. Толкование должен дать юрист
- id: pp588-amputation
  what: После операции ампутации гражданина направляют на экспертизу в течение 3 рабочих дней после операции
  where: Правила ПП 588 (стр. 8 PDF 0001202204080035)
  why_not_published: Не про паллиативную помощь
- id: pp588-transfer-bureau
  what: Направление на экспертизу передаётся в бюро в течение 3 рабочих дней со дня формирования
  where: Правила ПП 588 (стр. 10-11 PDF 0001202204080035)
  why_not_published: Общий срок передачи направления. Для паллиативных пациентов особые сроки уже в правилах pp588-referral и pp588-mse, как они сочетаются, должен сказать юрист
- id: pp588-returned-referral
  what: Медицинская организация в течение 14 рабочих дней со дня поступления возвращённого направления дополняет обследования
  where: Правила ПП 588 (стр. 11 PDF 0001202204080035)
  why_not_published: Срок для случая, когда бюро вернуло направление. Нужна проверка юристом, применяется ли он к паллиативным пациентам
- id: pp588-bureau-return
  what: Бюро в течение 3 рабочих дней возвращает направление в медицинскую организацию и в течение одного рабочего дня сообщает гражданину о возврате
  where: Правила ПП 588 (стр. 16-17 PDF 0001202204080035)
  why_not_published: 'Кандидат в правило: отсчёт от получения направления бюро, дату семья узнаёт не всегда. Решим после проверки юристом'
- id: pp588-additional-program
  what: Гражданин не позднее 3 рабочих дней после получения программы дополнительного обследования сообщает о согласии
  where: Правила ПП 588 (стр. 23 PDF 0001202204080035)
  why_not_published: Срок для самого гражданина. Показывать его как обязанность семьи без юриста не будем
- id: pp588-appeal-window
  what: Обжаловать решение бюро в главное бюро можно в месячный срок со дня его получения
  where: Правила ПП 588, п. 55 (стр. 32 PDF 0001202204080035)
  why_not_published: Калькулятор пока не считает сроки в месяцах. Срок упомянут в пояснении правила pp588-appeal-main
- id: pp588-appeal-federal
  what: Федеральное бюро не позднее 30 рабочих дней со дня поступления заявления проводит экспертизу
  where: Правила ПП 588 (стр. 34 PDF 0001202204080035)
  why_not_published: Кандидат в правило по образцу pp588-appeal-main, цитата ещё не снята со скана
- id: 692n-refusal-notice
  what: Решение о непризнании инвалидом без доступа к персональным данным направляется через единый портал или заказным письмом в течение 3 рабочих дней
  where: приказ 692н, прил. 2, п. 6 (стр. 9 PDF 0001202604140027)
  why_not_published: Особый порядок экспертизы без доступа к персональным данным, кому он применяется, должен решить юрист (как и 692n-mse)
- id: 59fz-copies-7
  what: Копия обращения в другие органы направляется в течение семи дней со дня регистрации
  where: 59-ФЗ, ч. 4 ст. 8
  why_not_published: Текста 59-ФЗ в нужной редакции на портале нет, цитаты из снимка ИПС не проверены. Главные сроки 59-ФЗ уже есть в правилах 59fz-answer и 59fz-redirect
- id: 59fz-return-7
  what: Обращение с обжалованием судебного решения, нечитаемое или непонятное, возвращается или о нём сообщают в течение семи дней со дня регистрации
  where: 59-ФЗ, ч. 2, 4, 4.1 ст. 11
  why_not_published: Текста 59-ФЗ в нужной редакции на портале нет. Случаи редкие для семей
- id: 59fz-migration-20
  what: Обращение о нарушениях в сфере миграции рассматривается в течение 20 дней
  where: 59-ФЗ, ч. 1.1 ст. 12
  why_not_published: Не про медицинскую помощь
acts:
- id: 356n
  what: приказ 356н
  why_not_published: не найден eoNumber и цитата-основание
- id: 23n
  what: приказ 23н
  why_not_published: не найден eoNumber и цитата-основание
- id: pp-2351
  what: постановление № 2351
  why_not_published: не найден eoNumber и цитата-основание
- id: 388n-p11
  what: п. 11 Порядка скорой медицинской помощи
  why_not_published: Приказа 2013 года нет на портале, изменения 424н вступают 01.01.2027, текст пункта не сверен
- id: gk-160-p3
  what: 'ГК РФ, п. 3 ст. 160: подпись другого гражданина (рукоприкладчика) за того, кто не может расписаться сам'
  why_not_published: В изменяющих законах на портале (100-ФЗ 2013 года, 259-ФЗ 2017 года, 101-ФЗ 2023 года) текста п. 3 ст. 160 нет, сама часть первая ГК 1994 года на портале не опубликована. Нужна сверка мейнтейнером в РФ по ИПС
- id: gk-1174-a4
  what: 'ГК РФ, абзац четвертый п. 3 ст. 1174: предельная сумма на похороны из вкладов'
  why_not_published: 'Полного текста абзаца в официальных публикациях на портале нет: закон 60-ФЗ 2016 года заменил в нём только слово «сорок» на «сто» (цитата 60fz-2016-s1). Сам абзац 2001 года нужно сверить по ИПС'
