- id: 789n-p2
  verified: true
  verified_at: 2026-10-11
  source_ref: pravo-789n
  act_id: 789n
  point: п. 2 Порядка
  anchor: p-2
  page: 2
  text: |-
    2. Для получения медицинских документов (их копий) или выписок из них пациент либо его законный представитель представляет запрос о предоставлении медицинских документов (их копий) и выписок из них на бумажном носителе (при личном обращении или по почте) либо запрос, сформированный в форме электронного документа, подписанного пациентом либо его законным представителем, в случае если пациентом является несовершеннолетний, не достигший возраста, установленного частью 2 статьи 54 Федерального закона от 21 ноября 2011 г. № 323-ФЗ «Об основах охраны здоровья граждан в Российской Федерации»², либо гражданин, признанный в установленном законом порядке недееспособным, с использованием усиленной квалифицированной электронной подписи или простой электронной подписи посредством применения федеральной государственной информационной системы «Единый портал государственных и муниципальных услуг (функций)» (далее – Единый портал государственных и муниципальных услуг), единой системы идентификации и аутентификации, федеральных государственных информационных систем в сфере здравоохранения, государственных информационных систем в сфере здравоохранения субъектов Российской Федерации, медицинских информационных систем медицинских организаций и иных информационных систем, предназначенных для сбора, хранения, обработки и предоставления информации, касающейся деятельности медицинских организаций и предоставляемых ими услуг (далее соответственно – запрос, информационные системы), который составляется в свободной форме и содержит:
    1) сведения о пациенте:
    а) фамилия, имя, отчество (при наличии);
    б) реквизиты документа, удостоверяющего личность пациента;
    в) адрес места жительства (места пребывания);
    г) почтовый адрес для направления письменных ответов и уведомлений и (в случае, если имеется) номер контактного телефона, адрес электронной почты (при наличии);
    2) в случае обращения от имени пациента его законного представителя – сведения о законном представителе, указанные в подпункте 1 настоящего пункта;
    3) наименования медицинских документов (их копий) или выписок из них, отражающих состояние здоровья пациента, которые пациент либо его законный представитель намерен получить, и период, за который он намерен их получить;
    4) сведения о способе получения пациентом (его законным представителем) запрашиваемых медицинских документов (их копий) или выписок из них (для получения медицинских документов (их копий) или выписок из них на бумажном носителе – при личном обращении или по почте, для получения медицинских документов и выписок из них в форме электронных документов – посредством направления в личный кабинет пациента (его законного представителя) на Едином портале государственных и муниципальных услуг с использованием единой государственной информационной системы в сфере здравоохранения или посредством информационных систем, указанных в частях 1 и 5 статьи 91 Федерального закона от 21 ноября 2011 г. № 323-ФЗ «Об основах охраны здоровья граждан в Российской Федерации»³);
    5) дату подачи запроса и подпись пациента либо его законного представителя (для письменного запроса).
  text_source: official_pdf
