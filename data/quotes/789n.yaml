- id: 789n-p8
  verified: true
  verified_at: 2026-10-11
  source_ref: pravo-789n
  act_id: 789n
  point: п. 8 Порядка
  anchor: p-8
  page: 5
  text: |-
    8. Максимальный срок выдачи медицинских документов (их копий) и выписок из них с момента регистрации в медицинской организации запроса не должен превышать сроков, установленных требованиями законодательства о порядке рассмотрения обращений граждан Российской Федерации⁵.
    В случае нахождения пациента на лечении в стационарных условиях или условиях дневного стационара, выписка из медицинских документов, копии медицинских документов предоставляются пациенту либо его законному представителю в суточный срок с момента обращения.
  text_source: official_pdf
