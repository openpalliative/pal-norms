  point: п. 37 Правил
  anchor: p-37
  page: 21
  text: 37. Медико-социальная экспертиза гражданина, находящегося на лечении в стационаре в связи с операцией по ампутации (реампутации) конечности (конечностей), имеющего дефекты, предусмотренные пунктами 14 и (или) 15 приложения к настоящим Правилам, нуждающегося в первичном протезировании, а также гражданина, признанного нуждающимся в оказании паллиативной медицинской помощи, проводится в срок, не превышающий 3 рабочих дней со дня поступления в бюро направления на медико-социальную экспертизу.
