- id: pp-588-p17
  verified: true
  verified_at: 2026-10-11
  source_ref: pravo-pp-588
  act_id: pp-588
  point: п. 17 Правил, абзац пятый
  anchor: p-17-5
  page: 8
  text: Гражданин, признанный нуждающимся в оказании паллиативной медицинской помощи, направляется на медико-социальную экспертизу в соответствии с решением врачебной комиссии медицинской организации в течение одного рабочего дня со дня получения результатов медицинских обследований, необходимых для получения клинико-функциональных данных в зависимости от заболевания в целях проведения медико-социальной экспертизы.
