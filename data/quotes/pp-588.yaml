- id: pp-588-p17-2
  verified: true
  verified_at: 2026-10-11
  source_ref: pravo-pp-588
  act_id: pp-588
  point: п. 17 Правил, абзац второй
  anchor: p-17-2
  page: 8
  text: Принятие решения врачебной комиссией медицинской организации о направлении гражданина на медико-социальную экспертизу и проведении медицинских обследований, необходимых для получения клинико-функциональных данных в зависимости от заболевания в целях проведения медико-социальной экспертизы, осуществляется не позднее 30 рабочих дней со дня принятия решения врачебной комиссией медицинской организации о подготовке такого направления.
