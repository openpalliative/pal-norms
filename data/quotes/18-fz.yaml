- id: 323fz-36-3
  verified: true
  verified_at: 2026-10-11
  source_ref: pravo-18-fz
  act_id: 18-fz
  point: ч. 3 ст. 36 закона 323-ФЗ (п. 4 закона 18-ФЗ)
  anchor: p-36-3
  page: 3
  text: 3. Паллиативная медицинская помощь оказывается в амбулаторных условиях, в том числе на дому, и в условиях дневного стационара, стационарных условиях медицинскими работниками, прошедшими обучение по оказанию такой помощи. Медицинские организации, оказывающие паллиативную медицинскую помощь, осуществляют взаимодействие с родственниками и иными членами семьи пациента или законным представителем пациента, лицами, осуществляющими уход за пациентом, добровольцами (волонтерами), а также организациями социального обслуживания, религиозными организациями, организациями, указанными в части 2 статьи 6 настоящего Федерального закона, в том числе в целях предоставления такому пациенту социальных услуг, мер социальной защиты (поддержки) в соответствии с законодательством Российской Федерации, мер психологической поддержки и духовной помощи.
