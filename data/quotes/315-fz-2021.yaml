  edition: Предложение ч. 7 ст. 20 закона 323-ФЗ в редакции Федерального закона от 02.07.2021 № 315-ФЗ (вступил в силу со дня опубликования 02.07.2021, ст. 2). Поиск на портале 11.10.2026 по названию закона 323-ФЗ более поздних изменений ст. 20 и 22 не нашёл (raw/ocr-diff/323fz-amendments.tsv). Изменения внутри законов с другим названием не проверены
- id: 323fz-22-4
  verified: true
  verified_at: 2026-10-11
  source_ref: pravo-315-fz-2021
  act_id: 315-fz-2021
  point: ч. 4 ст. 22 закона 323-ФЗ (подп. «а» п. 4 ст. 1 закона 315-ФЗ)
  anchor: p-22-4
  page: 3
  text: 4. Пациент либо его законный представитель имеет право непосредственно знакомиться с медицинской документацией, отражающей состояние его здоровья, и получать на основании такой документации консультации у других специалистов. Супруг (супруга), близкие родственники (дети, родители, усыновленные, усыновители, родные братья и родные сестры, внуки, дедушки, бабушки) либо иные лица, указанные пациентом или его законным представителем в письменном согласии на разглашение сведений, составляющих врачебную тайну, или информированном добровольном согласии на медицинское вмешательство, имеют право непосредственно знакомиться с медицинской документацией пациента, в том числе после его смерти, если пациент или его законный представитель не запретил разглашение сведений, составляющих врачебную тайну. Порядок ознакомления с медицинской документацией пациента устанавливается уполномоченным федеральным органом исполнительной власти.
