- id: pp-2188-pal-discharge
  verified: true
  verified_at: 2026-10-11
  source_ref: pravo-pp-2188
  act_id: pp-2188
  point: раздел II Программы, подраздел «Паллиативная медицинская помощь»
  anchor: p-pal-discharge
  page: 22
  text: Медицинские организации, оказывающие специализированную, в том числе паллиативную, медицинскую помощь, в случае выявления пациента, нуждающегося в паллиативной первичной медицинской помощи в амбулаторных условиях, в том числе на дому, за 3 дня до осуществления выписки указанного пациента из медицинской организации, оказывающей специализированную, в том числе паллиативную, медицинскую помощь в стационарных условиях и условиях дневного стационара, информируют о нем медицинскую организацию, к которой такой пациент прикреплен для получения первичной медико-санитарной помощи, или близлежащую к месту его пребывания медицинскую организацию, оказывающую первичную медико-санитарную помощь, в соответствии с маршрутизацией, принятой в субъекте Российской Федерации.
