- id: 100n-a1-p12
  verified: true
  verified_at: 2026-10-11
  source_ref: pravo-100n
  act_id: 100n
  point: прил. 1, п. 12
  anchor: p-a1-12
  page: 5
  text: |-
    12. В случае отсутствия у субъекта розничной торговли лекарственного препарата, указанного в рецепте, за исключением необходимости закупки лекарственного препарата, данный лекарственный препарат отпускается субъектом розничной торговли в срок, не превышающий десяти рабочих дней с даты обращения гражданина к субъекту розничной торговли, за исключением лекарственного препарата, выписанного на рецепте с пометкой «cito» (срочно), который отпускается в срок, не превышающий трех рабочих дней с даты обращения.
    В случае необходимости закупки лекарственного препарата, указанного в рецепте, данный лекарственный препарат отпускается субъектом розничной торговли в срок, не превышающий тридцати рабочих дней с даты обращения гражданина к субъекту розничной торговли.
