  text: 2. Признать утратившим силу приказ Министерства здравоохранения Российской Федерации от 24 ноября 2021 г. № 1093н «Об утверждении Правил отпуска лекарственных препаратов для медицинского применения аптечными организациями, индивидуальными предпринимателями, имеющими лицензию на осуществление фармацевтической деятельности, медицинскими организациями, имеющими лицензию на осуществление фармацевтической деятельности, и их обособленными подразделениями (амбулаториями, фельдшерскими и фельдшерско-акушерскими пунктами, центрами (отделениями) общей врачебной (семейной) практики), расположенными в сельских поселениях, в которых отсутствуют аптечные организации, а также Правил отпуска наркотических средств и психотропных веществ, зарегистрированных в качестве лекарственных препаратов для медицинского применения, лекарственных препаратов для медицинского применения, содержащих наркотические средства и психотропные вещества в том числе Порядка отпуска аптечными организациями иммунобиологических лекарственных препаратов» (зарегистрирован Министерством юстиции Российской Федерации 30 ноября 2021 г., регистрационный № 66142).
