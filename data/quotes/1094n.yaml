  anchor: p-a1-3
  page: 7
  text: 3. При выписке пациента из медицинской организации, в которой ему оказывалась медицинская помощь в стационарных условиях, при необходимости продолжения приема лекарственного препарата в амбулаторных условиях данному пациенту по решению руководителя медицинской организации назначаются с оформлением рецепта в форме электронного документа и (или) на бумажном носителе (за исключением оформления рецептов на лекарственные препараты, подлежащие отпуску бесплатно или со скидкой) либо выдаются (пациенту или его законному представителю) одновременно с выпиской из истории болезни лекарственные препараты, в том числе наркотические и психотропные лекарственные препараты, внесенные в списки II и III перечня наркотических средств, психотропных веществ и их прекурсоров, подлежащих контролю в Российской Федерации, утвержденного Правительством Российской Федерации⁶ (далее – Перечень), сильнодействующие лекарственные препараты, на срок приема пациентом до 5 дней.
