  edition: 'Ч. 2 ст. 22 закона 323-ФЗ: первые два предложения в редакции 2011 года, третье добавлено законом 271-ФЗ (цитата 323fz-22-2-s3). История ст. 22 по найденным на портале законам: 317-ФЗ 2013 года меняет ч. 4, 242-ФЗ 2017 года излагает ч. 5, 271-ФЗ 2020 года дополняет ч. 2, 315-ФЗ 2021 года излагает ч. 4 и дополняет ч. 5 (raw/ocr-diff/323fz-amendments.tsv, проверено 11.10.2026). Изменения внутри законов с другим названием не проверены'
- id: 323fz-22-3
  verified: true
  verified_at: 2026-10-11
  source_ref: pravo-323-fz
  act_id: 323-fz
  point: ч. 3 ст. 22 закона 323-ФЗ
  anchor: p-22-3
  page: 53
  text: 3. Информация о состоянии здоровья не может быть предоставлена пациенту против его воли. В случае неблагоприятного прогноза развития заболевания информация должна сообщаться в деликатной форме гражданину или его супругу (супруге), одному из близких родственников (детям, родителям, усыновленным, усыновителям, родным братьям и родным сестрам, внукам, дедушкам, бабушкам), если пациент не запретил сообщать им об этом и (или) не определил иное лицо, которому должна быть передана такая информация.
  text_source: official_pdf
