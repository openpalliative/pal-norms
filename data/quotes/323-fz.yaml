      notes: 'проход c (450 dpi, psm 3) дал расхождения только в распознавании: знаки препинания и пробелы, номера страниц и сносок, римские цифры и буквы, прочитанные как цифры или черта; спорные места заново сверены по вырезке 12.10.2026, текст цитаты верен. Таблица в raw/ocr-diff/323fz-22-1.second.tsv'
  edition: 'Ч. 1 ст. 22 закона 323-ФЗ в первоначальной редакции 2011 года, найденные изменения её не меняют. История ст. 22 по найденным на портале законам: 317-ФЗ 2013 года меняет ч. 4, 242-ФЗ 2017 года излагает ч. 5, 271-ФЗ 2020 года дополняет ч. 2, 315-ФЗ 2021 года излагает ч. 4 и дополняет ч. 5 (raw/ocr-diff/323fz-amendments.tsv, проверено 11.10.2026). Изменения внутри законов с другим названием не проверены'
- id: 323fz-22-2
  verified: true
  verified_at: 2026-10-11
  source_ref: pravo-323-fz
  act_id: 323-fz
  point: ч. 2 ст. 22 закона 323-ФЗ
  anchor: p-22-2
  page: 53
  text: 2. Информация о состоянии здоровья предоставляется пациенту лично лечащим врачом или другими медицинскими работниками, принимающими непосредственное участие в медицинском обследовании и лечении. В отношении лиц, не достигших возраста, установленного в части 2 статьи 54 настоящего Федерального закона, и граждан, признанных в установленном законом порядке недееспособными, информация о состоянии здоровья предоставляется их законным представителям.
  text_source: official_pdf
