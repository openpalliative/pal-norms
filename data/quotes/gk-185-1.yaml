  text: 3. Доверенность на получение заработной платы и иных платежей, связанных с трудовыми отношениями, на получение вознаграждения авторов и изобретателей, пенсий, пособий и стипендий или на получение корреспонденции, за исключением ценной корреспонденции, может быть удостоверена организацией, в которой доверитель работает или учится, и администрацией стационарного лечебного учреждения, в котором он находится на излечении. Такая доверенность удостоверяется бесплатно.
