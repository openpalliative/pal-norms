  edition: 'Ч. 5 ст. 22 закона 323-ФЗ в редакции Федерального закона от 29.07.2017 № 242-ФЗ (с 01.01.2018); второе предложение добавлено законом 315-ФЗ 2021 года (цитата 323fz-22-5-s2). История ст. 22 по найденным на портале законам: 317-ФЗ 2013 года меняет ч. 4, 242-ФЗ 2017 года излагает ч. 5, 271-ФЗ 2020 года дополняет ч. 2, 315-ФЗ 2021 года излагает ч. 4 и дополняет ч. 5 (raw/ocr-diff/323fz-amendments.tsv, проверено 11.10.2026). Изменения внутри законов с другим названием не проверены'
