  text: 5. Пациент либо его законный представитель имеет право по запросу, направленному в том числе в электронной форме, получать отражающие состояние здоровья пациента медицинские документы (их копии) и выписки из них, в том числе в форме электронных документов. Порядок и сроки предоставления медицинских документов (их копий) и выписок из них устанавливаются уполномоченным федеральным органом исполнительной власти.
