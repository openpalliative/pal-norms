  text: 3. К заключению лечащего врача, указанному в пункте 2 настоящего Порядка, прилагается информированное добровольное согласие пациента (его законного представителя) на медицинское вмешательство (далее – информированное добровольное согласие)⁵, а также анкета о состоянии домашних условий пациента (рекомендуемый образец содержится в приложении к настоящему Порядку), заполняемая и прилагаемая к заключению в случае передачи медицинского изделия для искусственной вентиляции легких (далее – аппарат ИВЛ) и медицинских изделий, предназначенных для использования совместно с аппаратом ИВЛ⁶, либо медицинской кровати и медицинских изделий, предназначенных для использования совместно с медицинской кроватью⁷ (далее – анкета).
