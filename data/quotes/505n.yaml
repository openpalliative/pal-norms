  anchor: p-4
  page: 3
  text: 4. Решение о передаче пациенту (его законному представителю) медицинского изделия принимается врачебной комиссией медицинской организации в течение трех рабочих дней со дня поступления документов, указанных в абзаце первом пункта 3 настоящего Порядка, оформляется в медицинской документации пациента и направляется в структурное подразделение медицинской организации, обеспечивающее организацию передачи пациенту (его законному представителю) медицинского изделия.
