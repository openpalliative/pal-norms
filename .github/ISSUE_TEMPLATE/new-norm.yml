name: Новая норма
description: Предложить акт, поправку или отмену, которых нет в наборе данных
title: "Норма: "
labels: ["review:data"]
body:
  - type: markdown
    attributes:
      value: |
        **Это сообщение увидят все. Не пишите ФИО, диагнозы, адреса, телефоны и номера документов**

        Берём только акты с официальной публикацией. Письма ведомств, ответы на обращения, региональные памятки и пересказы на сайтах не подходят
  - type: input
    id: title
    attributes:
      label: Вид, дата и номер акта
      placeholder: Приказ Минздрава России от ... № ...
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Ссылка на официальную публикацию
      placeholder: http://publication.pravo.gov.ru/document/...
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Что это
      options:
        - Новый акт
        - Поправка к акту из набора
        - Отмена акта из набора
        - Перенос выходных дней
        - Другое
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Как это касается паллиативной помощи
      description: Какие пункты, какие сроки или права семьи меняются
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверьте перед отправкой
      options:
        - label: В сообщении нет ФИО, диагнозов, адресов, телефонов и номеров документов
          required: true
