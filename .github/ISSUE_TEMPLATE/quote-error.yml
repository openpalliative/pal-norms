name: Ошибка в цитате
description: Цитата не совпадает с официальной публикацией, не та редакция, не тот пункт или неверная ссылка
title: "Цитата: "
labels: ["review:data"]
body:
  - type: markdown
    attributes:
      value: |
        **Это сообщение увидят все. Не пишите ФИО, диагнозы, адреса, телефоны и номера документов.** Не прикладывайте сканы своих документов, выписок и ответов ведомств

        Достаточно ссылки на официальную публикацию и номера страницы скана. Цитату исправим только по официальному тексту
  - type: input
    id: page
    attributes:
      label: Где на сайте ошибка
      description: Адрес страницы или id цитаты из набора данных
      placeholder: https://openpalliative.github.io/pal-norms/acts/...
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: Что написано у нас
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: Как в официальной публикации
      description: Перепишите дословно, со знаками препинания
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Ссылка на публикацию
      description: Портал официального опубликования publication.pravo.gov.ru или другой официальный источник
      placeholder: http://publication.pravo.gov.ru/document/...
    validations:
      required: true
  - type: input
    id: scan_page
    attributes:
      label: Страница скана
      placeholder: "3"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверьте перед отправкой
      options:
        - label: В сообщении нет ФИО, диагнозов, адресов, телефонов и номеров документов
          required: true
