name: Ошибка в сроке
description: Калькулятор или страница срока дают не ту дату, не тот порядок счёта или ссылаются не на ту норму
title: "Срок: "
labels: ["review:legal"]
body:
  - type: markdown
    attributes:
      value: |
        **Это сообщение увидят все. Не пишите ФИО, диагнозы, адреса, телефоны и номера документов.** Не описывайте свою историю подробно, нам нужна только норма и даты

        Толкования сроков пока не проверены юристом в РФ. Если вы юрист и видите ошибку в толковании, напишите, на что опираетесь
  - type: input
    id: rule
    attributes:
      label: Какой срок
      description: Название ситуации или адрес страницы срока
      placeholder: https://openpalliative.github.io/pal-norms/deadlines/...
    validations:
      required: true
  - type: input
    id: from
    attributes:
      label: Дата события, которую вы ввели
      placeholder: 15.01.2026
    validations:
      required: true
  - type: input
    id: got
    attributes:
      label: Какую дату показал сайт
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Какая дата должна быть
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Почему
      description: Пункт нормы, ссылка на официальную публикацию, производственный календарь
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверьте перед отправкой
      options:
        - label: В сообщении нет ФИО, диагнозов, адресов, телефонов и номеров документов
          required: true
